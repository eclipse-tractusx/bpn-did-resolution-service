---
name: "Manually publish Docker images to DockerHub"

on:
  workflow_call:
    inputs:
      namespace:
        description: 'The namespace (=repo) in DockerHub'
        required: false
        type: string
        default: "tractusx"
      docker_tag:
        description: 'Explicitly specify the Docker tag. Note that SHA and latest are added automatically.'
        required: false
        type: string
    secrets:
      DOCKER_HUB_USER:
        required: false
      DOCKER_HUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      namespace:
        description: 'The namespace (=repo) in DockerHub'
        required: false
        default: "tractusx"
      docker_tag:
        description: 'Explicitly specify the Docker tag. Note that SHA and latest are added automatically.'
        required: false

concurrency:
  # cancel only running jobs on pull requests
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  create-docker-image:
    name: "Create Docker Images for the BDRS-Server"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [
          { dir: runtimes, img: bdrs-server },
          { dir: runtimes, img: bdrs-server-memory },
        ]

    permissions:
      contents: write
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-docker-image
        name: Publish ${{ matrix.variant.img }}
        with:
          docker_tag: ${{ inputs.docker_tag }}
          rootDir: ${{ matrix.variant.dir }}
          imagename: ${{ matrix.variant.img }}
          namespace: ${{ inputs.namespace }}
          docker_user: ${{ secrets.DOCKER_HUB_USER }}
          docker_token: ${{ secrets.DOCKER_HUB_TOKEN }}
          do_push: 'true'
